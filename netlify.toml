# ============================================================
# 📁 File: netlify.toml
# 🚀 Netlify deployment config
# ============================================================
# ⚠️ REDIRECT ORDER IS CRITICAL — Netlify evaluates top-to-bottom.
#    /api/* and /media/* MUST come BEFORE the SPA fallback /*.
# ============================================================

[build]
  publish = "dist"
  command = "npm run build"

# ============================================================
# 1. API PROXY — /api/* → InfinityFree backend
# ============================================================
[[redirects]]
  from = "/api/*"
  to = "https://smartpossiaaaa.kesug.com/smart-pos-api/api/:splat"
  status = 200
  force = true

# ============================================================
# 2. MEDIA PROXY — /media/* → InfinityFree uploads
# ============================================================
[[redirects]]
  from = "/media/*"
  to = "https://smartpossiaaaa.kesug.com/smart-pos-api/uploads/:splat"
  status = 200
  force = true

# ============================================================
# 3. SPA FALLBACK — everything else → index.html
# ============================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================================
# SECURITY HEADERS
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================
# BUILD ENV
# ============================================================
[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_BASE_URL,VITE_API_BASE_URL2,VITE_MEDIA_BASE_URL,VITE_API_URL,VITE_PUBLIC_BASE_URL"