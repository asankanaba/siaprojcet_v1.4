# ============================================================
# 📁 File: netlify.toml
# 🚀 Netlify deployment config
# ============================================================
# NOTE: We do NOT proxy /api/* through Netlify. InfinityFree's
# CDN blocks server-to-server requests. The frontend calls
# InfinityFree directly from the browser.
# ============================================================

[build]
  publish = "dist"
  command = "npm run build"

# ============================================================
# SPA FALLBACK — everything serves index.html
# ============================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================================
# SECURITY HEADERS
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================
# BUILD ENV
# ============================================================
[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_BASE_URL,VITE_API_BASE_URL2,VITE_MEDIA_BASE_URL,VITE_API_URL,VITE_PUBLIC_BASE_URL"